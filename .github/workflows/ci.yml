# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
