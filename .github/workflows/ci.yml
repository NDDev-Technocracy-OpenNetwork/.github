# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@de3456fa347576fa72c0ad63c25d73f4d693271c # v0.6.58
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
