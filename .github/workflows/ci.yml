# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@85c691357b27e79e8b9eb7a2b7130fb179cd4c13 # v0.6.172
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
