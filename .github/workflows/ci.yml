# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
